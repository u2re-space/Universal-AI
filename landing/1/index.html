<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#ededed">
  <title>Émeric — See you soon</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="landing">
    <div class="content">
      <header class="header">
        <a class="brand" href="./" aria-label="Émeric home">
          <span class="brand-symbol" aria-hidden="true"></span>
          <span>ÉMERIC</span>
        </a>

        <nav class="socials" aria-label="Social links">
          <!-- Account destinations and notification service have not been supplied. -->
          <a role="link" aria-disabled="true">DRIBBBLE</a>
          <a role="link" aria-disabled="true">INSTAGRAM</a>
          <a role="link" aria-disabled="true">BEHANCE</a>
          <button type="button" class="pill pill-dark" aria-disabled="true">NOTIFY ME</button>
        </nav>
      </header>

      <section class="announcement" aria-labelledby="headline">
        <h1 id="headline">SEE YOU SOON.<br>WE’LL BE BACK IN<br>0 DAYS</h1>
        <!-- No showreel media has been supplied. -->
        <button type="button" class="showreel" aria-disabled="true">
          <span class="play" aria-hidden="true">
            <svg viewBox="0 0 40 44" fill="none">
              <path d="M7 5 35 22 7 39Z" stroke="currentColor"/>
            </svg>
          </span>
          <span>PLAY SHOWREEL</span>
        </button>
      </section>
    </div>

    <aside class="portrait">
      <img class="portrait-image" src="assets/hero-portrait-final.png" width="1024" height="1536" alt="Pale female android with blue-gray eyes, an ornate ivory biomechanical crown and sculpted armor.">
      <!-- No additional menu content has been supplied. -->
      <button type="button" class="pill menu-button" aria-disabled="true">MENU</button>
    </aside>
  </main>
</body>
</html>
