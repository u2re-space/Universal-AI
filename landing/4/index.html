<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#b9bdc7">
  <title>Blayden — Alex Walker</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main>
    <section class="hero" aria-labelledby="hero-title">
      <div class="rock rock-top" aria-hidden="true"></div>
      <div class="rock rock-bottom" aria-hidden="true"></div>

      <header class="site-header">
        <a class="brand" href="./" aria-label="Blayden home">
          <span class="brand-icon" aria-hidden="true">
            <svg viewBox="0 0 40 40" fill="none">
              <path d="M8 37V27h3v-7h4v-5l4 5h4l4-5v5h3v7h3v10M14 27h3m7 0h3M18 33h5"
                stroke="currentColor" stroke-width="1.6"
                stroke-linecap="square" stroke-linejoin="miter"/>
            </svg>
          </span>
          <span>Blayden*</span>
        </a>
        <a class="contact-dot" href="mailto:hello@alexwalker.design" aria-label="Contact Alex Walker"></a>
      </header>

      <div class="intro">
        <p>Hello!<br>I am Alex Walker</p>
        <h1 id="hero-title">Digital designer<br>&amp; illustrator</h1>
      </div>

      <a class="scroll-link" href="#work">
        Scroll for more
        <svg viewBox="0 0 20 20" aria-hidden="true" fill="none">
          <path d="m5 5 10 10M6 15h9V6" stroke="currentColor" stroke-width="1"/>
        </svg>
      </a>
    </section>

    <section class="work-preview" id="work" aria-label="Selected work">
      <div class="preview-image" role="img" aria-label="A preview of selected design work"></div>
    </section>
  </main>
</body>
</html>
